{% set version = "0.3.2" %}

package:
  name: simp-sexp
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/simp-sexp/simp_sexp-{{ version }}.tar.gz
  sha256: 5e8ee29e5b2ae2c77279cf0e76014ffae21a54b57b1315a07009e7d4f8e4120b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0.0
    - wheel
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - simp_sexp
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/devbisme/simp_sexp
  summary: A simple S-expression parser
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
